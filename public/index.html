<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hệ thống xử lý dữ liệu hàng hoá</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#16202b; --ink-soft:#5b6b7c; --line:#d3dce4; --line-soft:#e6ecf1;
  --paper:#eef2f5; --panel:#ffffff; --head:#1f3a5f; --head2:#2b5488;
  --accent:#1f6feb; --ok:#0f7a52; --ok-bg:#e7f5ee; --bad:#b4231f; --bad-bg:#fbeceb;
  --warn:#9a6206; --warn-bg:#fdf3d0; --mark:#fff7db;
  --radius:6px; --shadow:0 1px 3px rgba(20,32,43,.12),0 6px 18px rgba(20,32,43,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:14px;line-height:1.5}
.hidden{display:none !important}
button{font-family:inherit}

/* ---------- Login ---------- */
.login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1f3a5f,#2b5488)}
.login-box{background:var(--panel);width:360px;max-width:92vw;padding:34px 30px;border-radius:10px;box-shadow:var(--shadow)}
.login-title{margin:0 0 4px;font-size:22px;font-weight:600}
.login-sub{margin:0 0 22px;color:var(--ink-soft);font-size:13px}
.login-msg{min-height:18px;margin:10px 0 0;font-size:13px;color:var(--bad)}
.login-hint{margin:16px 0 0;font-size:12px;color:var(--ink-soft);background:var(--paper);padding:10px;border-radius:var(--radius)}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px}
.fld input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px}
.fld input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,111,235,.15)}

/* ---------- Layout ---------- */
.app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:18px;background:var(--head);color:#fff;
  padding:0 18px;height:52px;flex:0 0 auto}
.brand{font-weight:600;font-size:15px;white-space:nowrap}
.tabs{display:flex;gap:4px;flex:1}
.tab{background:transparent;color:#c7d6ea;border:none;padding:9px 16px;font-size:14px;
  border-radius:var(--radius) var(--radius) 0 0;cursor:pointer;font-weight:500}
.tab:hover{background:rgba(255,255,255,.1);color:#fff}
.tab.active{background:var(--paper);color:var(--head);font-weight:600}
.user-box{display:flex;align-items:center;gap:10px;font-size:13px;color:#c7d6ea}
.content{flex:1;overflow:auto;padding:18px}
.tabpane{display:none}
.tabpane.active{display:block}

/* ---------- Panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:16px}
.panel-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-soft);
  background:linear-gradient(#fff,#f7fafc)}
.panel-head h2{margin:0;font-size:15px;font-weight:600}
.panel-head .desc{font-size:12px;color:var(--ink-soft);font-weight:400}
.panel-head .spacer{flex:1}
.panel-body{padding:16px}
.panel-body.tight{padding:0}

/* ---------- Buttons ---------- */
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;
  border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:500;transition:.12s}
.btn:hover{background:#f2f6fa}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#1b5fd0}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-ok:hover{filter:brightness(1.06)}
.btn-danger{background:#fff;border-color:var(--bad);color:var(--bad)}
.btn-danger:hover{background:var(--bad-bg)}
.btn-ghost{background:transparent;border-color:rgba(255,255,255,.3);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-block{width:100%;margin-top:6px;padding:11px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Badges / notes ---------- */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.info{background:#e7f0fb;color:var(--accent)}
.flash{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin:0 0 12px;border:1px solid}
.flash.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.flash.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.flash.warn{background:var(--warn-bg);border-color:#e5c76b;color:var(--warn)}
.muted{color:var(--ink-soft)}
.stat{display:inline-flex;align-items:baseline;gap:6px;padding:6px 12px;background:var(--paper);
  border-radius:var(--radius);font-size:13px}
.stat b{font-size:16px}

/* ---------- Editable rule tables ---------- */
.rt-wrap{overflow:auto;max-height:360px;border-top:1px solid var(--line-soft)}
table.rt{border-collapse:collapse;width:100%;font-size:13px}
table.rt th,table.rt td{border:1px solid var(--line-soft);padding:0}
table.rt th{background:#f0f4f8;padding:8px 10px;text-align:left;font-weight:600;position:sticky;top:0;z-index:2}
table.rt td input{width:100%;border:none;padding:7px 10px;font-size:13px;background:transparent;font-family:inherit}
table.rt td input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:#fff}
table.rt td.act{text-align:center;width:44px;background:#fafbfc}
table.rt tr:nth-child(even) td{background:#fbfcfd}
.icon-btn{border:none;background:transparent;cursor:pointer;font-size:15px;padding:4px 6px;border-radius:4px;line-height:1}
.icon-btn:hover{background:#eef2f6}
.icon-btn.del:hover{background:var(--bad-bg)}

/* ---------- Data grid (bảng 2 nhập liệu) ---------- */
.grid-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.grid-scroll{overflow:auto;background:#fff;resize:vertical}
.grid-scroll.big{height:70vh}
.grid-scroll.small{height:340px}
table.grid{border-collapse:separate;border-spacing:0;font-size:12.5px;white-space:nowrap;font-family:ui-monospace,Consolas,monospace}
table.grid th,table.grid td{border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:0}
table.grid thead th{background:#eef3f8;position:sticky;top:0;z-index:3;padding:5px 8px;text-align:left;
  font-family:"Segoe UI",Arial,sans-serif;font-weight:600;cursor:pointer;user-select:none}
table.grid thead th .col-code{color:var(--accent);font-size:11px;margin-right:5px}
table.grid thead th:hover{background:#e2ebf4}
table.grid td{padding:0}
table.grid td .cell{padding:4px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:none}
table.grid td.gcell{cursor:cell}
table.grid td.sel{background:rgba(31,111,235,.14) !important}
table.grid td.anchor{box-shadow:inset 0 0 0 2px var(--accent)}
table.grid td .cell-edit{width:100%;border:none;padding:3px 7px;font:12.5px/1.4 ui-monospace,Consolas,monospace;outline:2px solid var(--accent);outline-offset:-2px;background:#fff}
table.grid td.rownum{background:#f6f9fb;color:var(--ink-soft);text-align:right;position:sticky;left:0;z-index:2;
  padding:4px 8px;font-family:"Segoe UI",Arial,sans-serif;min-width:46px;user-select:none}
table.grid tr.dupe td{background:var(--bad-bg)}
table.grid td.cell-err{background:var(--bad-bg) !important;box-shadow:inset 0 0 0 1px var(--bad)}
table.grid td.cell-warn{background:var(--warn-bg) !important}
table.grid td.cell-changed{background:#eaf6ee}
.sort-ind{font-size:10px;color:var(--accent);margin-left:3px}
.filter-row th{padding:3px}
.filter-row input{width:100%;border:1px solid var(--line);border-radius:3px;padding:3px 6px;font-size:11px;font-family:"Segoe UI",Arial}

/* ---------- Paste box ---------- */
.paste-ta{width:100%;border:1px solid var(--line);border-radius:var(--radius);
  padding:8px 12px;font:13px/1.4 ui-monospace,Consolas,monospace;color:var(--ink);
  background:#fafcfe;resize:vertical;min-height:34px}
.paste-ta:focus{outline:none;border-color:var(--accent);background:#fff}

/* ---------- Cột kéo chỉnh chiều rộng ---------- */
table.grid thead th.colhead{position:sticky;top:0;overflow:hidden}
table.grid thead th .col-resize{position:absolute;top:0;right:0;width:6px;height:100%;
  cursor:col-resize;user-select:none}
table.grid thead th .col-resize:hover{background:var(--accent)}
table.grid thead th.corner{background:#eef3f8;position:sticky;left:0;top:0;z-index:5}

/* ---------- Translate ---------- */
.tr-cols{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line-soft)}
.tr-cols textarea{border:none;padding:10px;font-size:13px;min-height:300px;resize:vertical;font-family:ui-monospace,Consolas,monospace}
.tr-cols textarea:first-child{border-right:1px solid var(--line-soft)}
.tr-cols textarea:focus{outline:none;background:#fffdf5}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 14px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--accent);color:#fff}

/* ---------- Failed table ---------- */
table.fail{border-collapse:collapse;width:100%;font-size:12.5px}
table.fail th,table.fail td{border:1px solid var(--line-soft);padding:6px 9px;text-align:left}
table.fail th{background:#f0f4f8;font-weight:600}
table.fail tr:hover td{background:var(--mark)}
.reason{color:var(--bad);font-size:12px}

/* ---------- Admin ---------- */
table.users{border-collapse:collapse;width:100%;font-size:13px}
table.users th,table.users td{border:1px solid var(--line-soft);padding:8px 11px;text-align:left}
table.users th{background:#f0f4f8;font-weight:600}
.chip{display:inline-block;padding:2px 9px;border-radius:4px;font-size:12px;font-weight:600;background:#e7f0fb;color:var(--accent)}
.chip.admin{background:#f3e8ff;color:#7c3aed}
.chip.viewer{background:#e7f5ee;color:var(--ok)}
.chip.off{background:#eef1f4;color:var(--ink-soft)}

/* ---------- Modal ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(20,32,43,.5);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:10px;box-shadow:var(--shadow);width:460px;max-width:94vw;max-height:88vh;overflow:auto}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line-soft);font-size:16px;font-weight:600}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line-soft);display:flex;gap:10px;justify-content:flex-end}
.modal .fld{margin-bottom:14px}
.confirm-tbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.confirm-tbl td{padding:6px 4px}
.confirm-tbl td:first-child{color:var(--ink-soft)}
.confirm-tbl td:last-child{text-align:right;font-weight:600}
select.inp{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;width:100%}
input.inp{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;width:100%}
.upload-hint{font-size:12px;color:var(--ink-soft);margin-top:6px}

</style>
</head>
<body>
<div id="login-screen" class="login-screen">
  <div class="login-box">
    <h1 class="login-title">Đăng nhập hệ thống</h1>
    <p class="login-sub">Hệ thống xử lý dữ liệu hàng hoá</p>
    <label class="fld"><span>Tên đăng nhập / ID</span><input id="login-user" type="text" autocomplete="username" spellcheck="false"></label>
    <label class="fld"><span>Mật khẩu</span><input id="login-pass" type="password" autocomplete="current-password"></label>
    <button id="login-btn" class="btn btn-primary btn-block">Đăng nhập</button>
    <p id="login-msg" class="login-msg"></p>
    <p class="login-hint">Lần đầu chạy: tài khoản <b>admin</b> / <b>admin</b> — đăng nhập xong đổi mật khẩu ngay.</p>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand">Xử lý dữ liệu hàng hoá</div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="input">1. Nhập liệu</button>
      <button class="tab" data-tab="mec">2. Kéo MEC</button>
      <button class="tab" data-tab="rules">3. Rule setup</button>
      <button class="tab" data-tab="admin">4. Admin</button>
    </nav>
    <div class="user-box">
      <span id="who"></span>
      <button id="logout-btn" class="btn btn-ghost btn-sm">Đăng xuất</button>
    </div>
  </header>
  <main class="content">
    <section id="tab-input" class="tabpane active"></section>
    <section id="tab-mec" class="tabpane"></section>
    <section id="tab-rules" class="tabpane"></section>
    <section id="tab-admin" class="tabpane"></section>
  </main>
</div>

<div id="modal-root"></div>

<script>
(function(){

/* ==================== util.js ==================== */
/* Tiện ích dùng chung */

const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function el(tag, attrs = {}, children = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return n;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}

/* Đọc clipboard dán từ Excel -> {headers, rows}.
   Ưu tiên text/html để lấy đúng cấu trúc ô + giá trị gốc số dài. */
function parseClipboard(cd) {
  let html = '', plain = '';
  try { html  = cd.getData('text/html')  || ''; } catch {}
  try { plain = cd.getData('text/plain') || ''; } catch {}

  let matrix = null;
  if (html) matrix = parseHtmlTable(html);
  if (!matrix && plain) matrix = parsePlain(plain);
  if (!matrix || !matrix.length) return null;

  const headers = matrix[0].map(h => (h ?? '').toString().trim());
  const rows = matrix.slice(1);
  // chuẩn hoá số cột
  const width = Math.max(headers.length, ...rows.map(r => r.length));
  while (headers.length < width) headers.push('');
  rows.forEach(r => { while (r.length < width) r.push(''); });
  return { headers, rows };
}

function parseHtmlTable(html) {
  try {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const trs = doc.querySelectorAll('tr');
    if (!trs.length) return null;
    const out = [];
    trs.forEach(tr => {
      const row = [];
      tr.querySelectorAll('td,th').forEach(td => {
        // Excel gắn thuộc tính x:num / x:str với giá trị GỐC chưa định dạng
        let v = td.getAttribute('x:num');
        if (v == null) v = (td.textContent || '');
        row.push(v.replace(/\u00a0/g, ' ').trim());
      });
      if (row.length) out.push(row);
    });
    return out.length ? out : null;
  } catch { return null; }
}

function parsePlain(text) {
  const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
  if (lines.length && lines[lines.length - 1] === '') lines.pop();
  return lines.map(l => l.split('\t'));
}

/* Parser TSV bền: xử lý ô bọc trong dấu " (có tab/xuống dòng bên trong) như Excel copy ra. */
function parseTSVToTable(text) {
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const rows = []; let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === '\t') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  if (rows.length && rows[rows.length - 1].length === 1 && rows[rows.length - 1][0] === '') rows.pop();
  if (!rows.length) return null;

  const headers = rows[0].map(h => (h ?? '').toString().trim());
  const body = rows.slice(1);
  const width = Math.max(headers.length, ...body.map(r => r.length), 1);
  while (headers.length < width) headers.push('');
  body.forEach(r => { while (r.length < width) r.push(''); });
  return { headers, rows: body };
}

/* Đọc file Excel qua SheetJS -> mảng dòng [{a,b} ...] cho bảng rule (2-3 cột) */
function readExcelToPairs(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const arr = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        // bỏ dòng tiêu đề nếu ô đầu không giống dữ liệu; giữ đơn giản: lấy tất cả, cột A/B
        const rows = arr
          .map(r => ({ a: (r[0] ?? '').toString().trim(), b: (r[1] ?? '').toString().trim() }))
          .filter(r => r.a !== '');
        resolve(rows);
      } catch (err) { reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function toast(msg, kind = 'ok', ms = 2600) {
  const t = el('div', { class: 'flash ' + kind, text: msg });
  Object.assign(t.style, {
    position: 'fixed', bottom: '20px', left: '50%', transform: 'translateX(-50%)',
    zIndex: 200, boxShadow: '0 6px 20px rgba(0,0,0,.2)', minWidth: '240px', textAlign: 'center'
  });
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

function modal({ title, bodyNode, actions }) {
  const root = $('#modal-root');
  const mask = el('div', { class: 'modal-mask' });
  const box = el('div', { class: 'modal' }, [
    el('div', { class: 'modal-head', text: title }),
    el('div', { class: 'modal-body' }, [bodyNode]),
  ]);
  const foot = el('div', { class: 'modal-foot' });
  const close = () => mask.remove();
  (actions || []).forEach(a => {
    foot.appendChild(el('button', {
      class: 'btn ' + (a.cls || ''), text: a.label,
      onclick: () => a.onClick ? a.onClick(close) : close()
    }));
  });
  box.appendChild(foot);
  mask.appendChild(box);
  mask.addEventListener('click', e => { if (e.target === mask) close(); });
  root.appendChild(mask);
  return close;
}


/* ==================== rules.js ==================== */
/*
 * ENGINE ÁP RULE
 * ---------------------------------------------------------------
 * Chuyển ký hiệu cột Excel (A, B, ... Z, AA, AB) sang chỉ số 0-based
 * và áp lần lượt 4 nhóm rule lên bảng dữ liệu chính.
 * ---------------------------------------------------------------
 */

/* "A" -> 0, "B" -> 1, ... "Z" -> 25, "AA" -> 26, "AB" -> 27 ... */
function colToIndex(code) {
  if (typeof code !== 'string') return -1;
  code = code.trim().toUpperCase();
  if (!/^[A-Z]+$/.test(code)) return -1;
  let n = 0;
  for (let i = 0; i < code.length; i++) n = n * 26 + (code.charCodeAt(i) - 64);
  return n - 1;
}

/* 0 -> "A", 27 -> "AB" */
function indexToCol(n) {
  let s = '';
  n = n + 1;
  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

/* Chuỗi "AA, AB, AC" -> [26, 27, 28] (bỏ mã không hợp lệ) */
function parseTargets(str) {
  if (!str) return [];
  return String(str).split(/[,;\s]+/).map(s => s.trim()).filter(Boolean)
    .map(colToIndex).filter(i => i >= 0);
}

/* Xây map tra cứu từ danh sách dòng {a,b} -> { a(chuẩn hoá): b } */
function buildLookup(rows) {
  const map = new Map();
  for (const r of rows || []) {
    const a = (r.a ?? '').toString().trim();
    if (a === '') continue;
    map.set(a, (r.b ?? '').toString());
    // thêm khoá chuẩn hoá (bỏ hoa/thường + khoảng trắng) để khớp linh hoạt
    const norm = a.toLowerCase().replace(/\s+/g, ' ');
    if (!map.has('~' + norm)) map.set('~' + norm, (r.b ?? '').toString());
  }
  return map;
}
function lookupValue(map, val) {
  const s = (val ?? '').toString().trim();
  if (map.has(s)) return { hit: true, val: map.get(s) };
  const norm = '~' + s.toLowerCase().replace(/\s+/g, ' ');
  if (map.has(norm)) return { hit: true, val: map.get(norm) };
  return { hit: false, val };
}

/*
 * Áp toàn bộ rule lên grid.
 * grid: { headers:[], rows:[[...]] }
 * rules: { unit, special, currency, replace }  (mỗi cái có targets + rows)
 * Trả về: { grid, changed:Set("r:c"), warnings:[], rulesApplied:int, currencyBlocks:[] }
 */
function applyRules(grid, rules) {
  const rows = grid.rows.map(r => r.slice());
  const changed = new Set();
  const warnings = [];
  const currencyBlocks = [];   // dòng có tiền tệ = BLOCK (vd VND)
  let rulesApplied = 0;

  const mark = (ri, ci, oldV, newV) => {
    if (String(oldV) !== String(newV)) changed.add(ri + ':' + ci);
  };

  /* ---------- RULE 1: Đơn vị (bảng unit) — thay giá trị theo tra cứu ---------- */
  {
    const t = parseTargets(rules.unit?.targets);
    const map = buildLookup(rules.unit?.rows);
    if (t.length && map.size) {
      rulesApplied++;
      for (let ri = 0; ri < rows.length; ri++)
        for (const ci of t) {
          const old = rows[ri][ci];
          const res = lookupValue(map, old);
          if (res.hit) { rows[ri][ci] = res.val; mark(ri, ci, old, res.val); }
        }
    }
  }

  /* ---------- RULE 2: Ký tự đặc biệt (bảng special) — thay/bỏ ký tự ---------- */
  {
    const t = parseTargets(rules.special?.targets);
    const pairs = (rules.special?.rows || [])
      .map(r => ({ a: (r.a ?? '').toString(), b: (r.b ?? '').toString() }))
      .filter(p => p.a !== '');
    if (t.length && pairs.length) {
      rulesApplied++;
      for (let ri = 0; ri < rows.length; ri++)
        for (const ci of t) {
          const old = rows[ri][ci];
          if (old == null) continue;
          let s = String(old);
          for (const p of pairs) s = s.split(p.a).join(p.b); // thay literal, kể cả rỗng
          if (s !== String(old)) { rows[ri][ci] = s; mark(ri, ci, old, s); }
        }
    }
  }

  /* ---------- RULE 3: Tiền tệ ---------- */
  /* valueCol = cột GIÁ TRỊ (vd AN), curCol = cột MÃ TIỀN TỆ (vd AO).
     Với mỗi dòng: tra tỷ giá theo mã ở curCol.
       - BLOCK  -> đánh dấu dòng vi phạm (vd VND)
       - số     -> valueCol = valueCol(cũ) × tỷ giá, làm tròn 2 số lẻ */
  {
    const vi = colToIndex(rules.currency?.valueCol);
    const ci = colToIndex(rules.currency?.curCol);
    const map = buildLookup(rules.currency?.rows);
    if (vi >= 0 && ci >= 0 && map.size) {
      rulesApplied++;
      for (let ri = 0; ri < rows.length; ri++) {
        const cur = rows[ri][ci];
        const res = lookupValue(map, cur);
        if (!res.hit) continue;
        if (String(res.val).toUpperCase() === 'BLOCK') {
          currencyBlocks.push({ row: ri, col: ci, cur: String(cur).trim() });
        } else {
          const rate = parseFloat(String(res.val).replace(/,/g, ''));
          const oldVal = parseFloat(String(rows[ri][vi] ?? '').replace(/,/g, ''));
          if (!isNaN(rate) && !isNaN(oldVal)) {
            const nv = Math.round(oldVal * rate * 100) / 100;
            const old = rows[ri][vi];
            rows[ri][vi] = String(nv);
            mark(ri, vi, old, rows[ri][vi]);
          }
        }
      }
    }
  }

  /* ---------- RULE 4: Thay chuỗi (bảng replace) ---------- */
  {
    const t = parseTargets(rules.replace?.targets);
    const pairs = (rules.replace?.rows || [])
      .map(r => ({ a: (r.a ?? '').toString(), b: (r.b ?? '').toString() }))
      .filter(p => p.a !== '');
    if (t.length && pairs.length) {
      rulesApplied++;
      for (let ri = 0; ri < rows.length; ri++)
        for (const ci of t) {
          const old = rows[ri][ci];
          if (old == null) continue;
          let s = String(old);
          for (const p of pairs) s = s.split(p.a).join(p.b);
          if (s !== String(old)) { rows[ri][ci] = s; mark(ri, ci, old, s); }
        }
    }
  }

  return { grid: { headers: grid.headers.slice(), rows }, changed, warnings, rulesApplied, currencyBlocks };
}

/* Phát hiện chuỗi tiếng Việt có dấu (dùng để bắt lỗi cột Cargo) */
function hasVietnameseDiacritics(s) {
  if (s == null) return false;
  return /[àáảãạăằắẳẵặâầấẩẫậèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵđ]/i.test(String(s));
}

/*
 * LỚP LƯU TRỮ HAI CHẾ ĐỘ
 * - Chạy trên Cloudflare Pages: dùng API + D1 (dữ liệu CHUNG mọi nhân viên).
 * - Mở ở nơi khác: tự lùi về localStorage để test.
 */

const API_BASE = '/api';
const TOKEN_KEY = 'hhdata::token';

async function hashPassword(plain, salt) {
  salt = salt || crypto.getRandomValues(new Uint8Array(16));
  const enc = new TextEncoder();
  const keyMat = await crypto.subtle.importKey('raw', enc.encode(plain), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' }, keyMat, 256);
  const toHex = a => Array.from(a).map(b => b.toString(16).padStart(2, '0')).join('');
  return toHex(salt) + ':' + toHex(new Uint8Array(bits));
}
async function verifyPassword(plain, stored) {
  if (!stored || stored.indexOf(':') < 0) return false;
  const salt = new Uint8Array(stored.split(':')[0].match(/.{2}/g).map(h => parseInt(h, 16)));
  return (await hashPassword(plain, salt)) === stored;
}

const LS = {
  get(k, f) { try { const r = localStorage.getItem('hhdata::' + k); return r == null ? f : JSON.parse(r); } catch { return f; } },
  set(k, v) { try { localStorage.setItem('hhdata::' + k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem('hhdata::' + k); } catch {} },
};

function defaultRules() {
  return {
    unit:     { targets: '', rows: [ {a:'件',b:'SET'},{a:'千克',b:'KGM'},{a:'码',b:'MTR'},{a:'份',b:'SET'} ] },
    special:  { targets: '', rows: [ {a:'(',b:''},{a:')',b:''},{a:'/',b:''},{a:'-',b:''},{a:'+',b:''} ] },
    currency: { valueCol: '', curCol: '', rows: [ {a:'EUR',b:'1.08'},{a:'HKD',b:'0.128'},{a:'CNY',b:'0.1385'},{a:'USD',b:'1'},{a:'VND',b:'BLOCK'} ] },
    replace:  { targets: '', rows: [] },
  };
}

/* ===================== BACKEND LOCAL ===================== */
const LocalBackend = {
  async ensureAdmin() {
    let u = LS.get('users', null);
    if (!u) { u = [{ id: 'admin', name: 'Quản trị viên', passHash: await hashPassword('admin'),
      role: 'admin', canEdit: true, canReport: true, mustChange: true, active: true, createdAt: Date.now() }];
      LS.set('users', u); }
    return u;
  },
  strip(u) { const { passHash, ...rest } = u; return rest; },

  async login(id, pass) {
    const users = await this.ensureAdmin();
    const u = users.find(x => x.id.toLowerCase() === id.toLowerCase());
    if (!u || !u.active) return { ok: false, msg: 'Tài khoản không tồn tại hoặc đã bị khoá.' };
    if (!(await verifyPassword(pass, u.passHash))) return { ok: false, msg: 'Sai mật khẩu.' };
    LS.set('session', { id: u.id });
    return { ok: true, user: this.strip(u), token: 'local', mustChange: !!u.mustChange };
  },
  async resume() {
    const s = LS.get('session', null); if (!s) return { ok: false };
    const users = await this.ensureAdmin();
    const u = users.find(x => x.id === s.id);
    return u ? { ok: true, user: this.strip(u), mustChange: !!u.mustChange } : { ok: false };
  },
  async logout() { LS.del('session'); },

  async listUsers() { return (await this.ensureAdmin()).map(this.strip); },
  async saveUser(user, plainPass) {
    const users = await this.ensureAdmin();
    const idx = users.findIndex(x => x.id.toLowerCase() === user.id.toLowerCase());
    if (idx < 0) {
      users.push({ ...user, passHash: await hashPassword(plainPass || '123456'),
        mustChange: true, createdAt: Date.now() });
    } else {
      const keepHash = users[idx].passHash;
      users[idx] = { ...users[idx], ...user, passHash: keepHash };
      if (plainPass) { users[idx].passHash = await hashPassword(plainPass); users[idx].mustChange = true; }
    }
    LS.set('users', users); return { ok: true };
  },
  async deleteUser(id) {
    let users = await this.ensureAdmin();
    users = users.filter(x => x.id !== id); LS.set('users', users); return { ok: true };
  },
  async resetPassword(id) {
    const users = await this.ensureAdmin();
    const i = users.findIndex(x => x.id === id);
    if (i >= 0) { users[i].passHash = await hashPassword('123456'); users[i].mustChange = true; LS.set('users', users); }
    return { ok: true };
  },
  async changePassword(id, newPass) {
    const users = await this.ensureAdmin();
    const i = users.findIndex(x => x.id === id);
    if (i >= 0) { users[i].passHash = await hashPassword(newPass); users[i].mustChange = false; LS.set('users', users); }
    return { ok: true };
  },

  async getRules() { let r = LS.get('rules', null); if (!r) { r = defaultRules(); LS.set('rules', r); } return r; },
  async setRules(r) { LS.set('rules', r); return { ok: true }; },
  async getDict() { let d = LS.get('dict', null); if (!d) { d = { en: [], cn: [] }; LS.set('dict', d); } return d; },
  async setDict(d) { LS.set('dict', d); return { ok: true }; },

  async keyExists(key) {
    const keys = LS.get('manifest_keys', {});
    const today = new Date().toISOString().slice(0, 10);
    return !!keys[today + '::' + String(key).trim()];
  },
  async getExistingKeys() {
    const keys = LS.get('manifest_keys', {});
    const today = new Date().toISOString().slice(0, 10);
    const pref = today + '::';
    const set = new Set();
    for (const k in keys) if (k.startsWith(pref)) set.add(k.slice(pref.length));
    return set;
  },
  async pushManifest(rows, keyColIndex) {
    const keys = LS.get('manifest_keys', {}); const store = LS.get('manifest_rows', []);
    const today = new Date().toISOString().slice(0, 10); let added = 0;
    for (const row of rows) {
      const k = String(row[keyColIndex] ?? '').trim(); if (!k) continue;
      keys[today + '::' + k] = { date: today, at: Date.now() };
      store.push({ key: k, date: today, data: row }); added++;
    }
    LS.set('manifest_keys', keys); LS.set('manifest_rows', store);
    return { ok: true, added };
  },
};

/* ===================== BACKEND API (Cloudflare) ===================== */
function authHeaders() {
  const t = localStorage.getItem(TOKEN_KEY);
  return t ? { 'x-auth-token': t, 'content-type': 'application/json' } : { 'content-type': 'application/json' };
}
async function api(path, opts = {}) {
  const r = await fetch(API_BASE + path, { headers: authHeaders(), ...opts });
  let data = null; try { data = await r.json(); } catch {}
  if (!r.ok) return { ok: false, status: r.status, ...(data || {}) };
  return data ?? { ok: true };
}

const ApiBackend = {
  async login(id, pass) {
    const r = await api('/login', { method: 'POST', body: JSON.stringify({ id, pass }) });
    if (r.ok && r.token) localStorage.setItem(TOKEN_KEY, r.token);
    return r;
  },
  async resume() {
    const t = localStorage.getItem(TOKEN_KEY); if (!t) return { ok: false };
    return api('/me');
  },
  async logout() { await api('/logout', { method: 'POST' }); localStorage.removeItem(TOKEN_KEY); },

  async listUsers() { const r = await api('/users'); return r.users || []; },
  async saveUser(user, plainPass) { return api('/users', { method: 'POST', body: JSON.stringify({ user, plainPass }) }); },
  async deleteUser(id) { return api('/users/' + encodeURIComponent(id), { method: 'DELETE' }); },
  async resetPassword(id) { return api('/users/' + encodeURIComponent(id) + '/reset', { method: 'POST' }); },
  async changePassword(id, newPass) { return api('/change-password', { method: 'POST', body: JSON.stringify({ id, newPass }) }); },

  async getRules() { const r = await api('/rules'); return (r && r.rules) ? r.rules : defaultRules(); },
  async setRules(rules) { return api('/rules', { method: 'PUT', body: JSON.stringify({ rules }) }); },
  async getDict() { const r = await api('/dict'); return (r && r.dict) ? r.dict : { en: [], cn: [] }; },
  async setDict(dict) { return api('/dict', { method: 'PUT', body: JSON.stringify({ dict }) }); },

  async keyExists(key) { const r = await api('/key-exists?key=' + encodeURIComponent(key)); return !!(r && r.exists); },
  async getExistingKeys() { const r = await api('/keys'); return new Set((r && r.keys) || []); },
  async pushManifest(rows, keyColIndex) { return api('/manifest', { method: 'POST', body: JSON.stringify({ rows, keyColIndex }) }); },
};

/* ===================== STORE ===================== */
const Store = {
  mode: 'local',
  B: LocalBackend,

  async init() {
    try {
      const r = await fetch(API_BASE + '/ping', { cache: 'no-store' });
      if (r.ok) { this.mode = 'api'; this.B = ApiBackend; return this.mode; }
    } catch {}
    this.mode = 'local'; this.B = LocalBackend; return this.mode;
  },

  login(id, pass)        { return this.B.login(id, pass); },
  resume()               { return this.B.resume(); },
  logout()               { return this.B.logout(); },
  listUsers()            { return this.B.listUsers(); },
  saveUser(u, p)         { return this.B.saveUser(u, p); },
  deleteUser(id)         { return this.B.deleteUser(id); },
  resetPassword(id)      { return this.B.resetPassword(id); },
  changePassword(id, np) { return this.B.changePassword(id, np); },
  getRules()             { return this.B.getRules(); },
  setRules(r)            { return this.B.setRules(r); },
  getDict()              { return this.B.getDict(); },
  setDict(d)             { return this.B.setDict(d); },
  keyExists(k)           { return this.B.keyExists(k); },
  getExistingKeys()      { return this.B.getExistingKeys(); },
  pushManifest(rows, ki) { return this.B.pushManifest(rows, ki); },
};


/* ==================== dataGrid.js ==================== */

/*
 * Lưới dữ liệu chính (Bảng 2) — thao tác như Excel:
 * - Kéo chọn vùng nhiều ô/dòng; Shift+click mở rộng vùng
 * - Ctrl+C copy cả vùng (dạng bảng), Ctrl+V dán cả vùng từ ô đang chọn
 * - Nhấp đúp để sửa ô; Delete để xoá nội dung vùng chọn
 * - Sort/filter theo cột; kéo viền tiêu đề để chỉnh rộng cột; virtual scroll
 */
function DataGrid(host, model) {
  let sortCol = -1, sortDir = 1;
  const filters = {};
  let view = [];
  const ROW_H = 27, BUFFER = 8;
  const nCols = model.headers.length;
  if (!model.colW || model.colW.length !== nCols) model.colW = new Array(nCols).fill(120);

  // vùng chọn theo chỉ số VIEW (vi) và cột (ci)
  let anchor = null, focusCell = null, dragging = false, editing = null;

  const scroll = el('div', { class: 'grid-scroll big', tabindex: '0' });
  host.innerHTML = '';
  host.appendChild(scroll);

  function computeView() {
    view = [];
    for (let i = 0; i < model.rows.length; i++) {
      let ok = true;
      for (const c in filters) { const f = filters[c]; if (f && (model.rows[i][c] ?? '').toString().toLowerCase().indexOf(f) < 0) { ok = false; break; } }
      if (ok) view.push(i);
    }
    if (sortCol >= 0) {
      view.sort((ra, rb) => {
        const a = model.rows[ra][sortCol] ?? '', b = model.rows[rb][sortCol] ?? '';
        const na = parseFloat(a), nb = parseFloat(b);
        let cmp;
        if (!isNaN(na) && !isNaN(nb) && String(a).trim() !== '' && String(b).trim() !== '') cmp = na - nb;
        else cmp = String(a).localeCompare(String(b), 'vi');
        return cmp * sortDir;
      });
    }
  }

  function selRange() {
    if (!anchor || !focusCell) return null;
    return { r1: Math.min(anchor.vi, focusCell.vi), r2: Math.max(anchor.vi, focusCell.vi),
             c1: Math.min(anchor.ci, focusCell.ci), c2: Math.max(anchor.ci, focusCell.ci) };
  }
  function inSel(vi, ci) { const s = selRange(); return s && vi >= s.r1 && vi <= s.r2 && ci >= s.c1 && ci <= s.c2; }

  let tbody, colgroup;
  function mount() {
    const table = el('table', { class: 'grid' });
    colgroup = el('colgroup');
    colgroup.appendChild(el('col', { style: 'width:46px' }));
    for (let ci = 0; ci < nCols; ci++) colgroup.appendChild(el('col', { style: 'width:' + model.colW[ci] + 'px' }));
    table.appendChild(colgroup);

    const thead = el('thead');
    const trHead = el('tr', {}, el('th', { class: 'corner', text: '#' }));
    model.headers.forEach((h, ci) => {
      const th = el('th', { class: 'colhead', title: h }, [
        el('span', { class: 'col-code', text: indexToCol(ci) }),
        document.createTextNode(h || ''),
        sortCol === ci ? el('span', { class: 'sort-ind', text: sortDir > 0 ? '▲' : '▼' }) : null,
      ]);
      th.addEventListener('click', (e) => { if (e.target.classList.contains('col-resize')) return; if (sortCol === ci) sortDir *= -1; else { sortCol = ci; sortDir = 1; } clearSel(); refresh(); });
      const grip = el('span', { class: 'col-resize' });
      grip.addEventListener('mousedown', (e) => startResize(e, ci));
      grip.addEventListener('click', e => e.stopPropagation());
      th.appendChild(grip);
      trHead.appendChild(th);
    });
    thead.appendChild(trHead);

    const trF = el('tr', { class: 'filter-row' }, el('th', { class: 'corner' }));
    model.headers.forEach((h, ci) => {
      trF.appendChild(el('th', {}, el('input', { placeholder: 'lọc…', value: filters[ci] || '', oninput: e => { filters[ci] = e.target.value.trim().toLowerCase(); clearSel(); refresh(); } })));
    });
    thead.appendChild(trF);
    table.appendChild(thead);

    tbody = el('tbody');
    table.appendChild(tbody);
    scroll.innerHTML = '';
    scroll.appendChild(table);
    scroll.onscroll = renderRows;
  }

  function startResize(e, ci) {
    e.preventDefault(); e.stopPropagation();
    const startX = e.clientX, startW = model.colW[ci], col = colgroup.children[ci + 1];
    const onMove = (ev) => { const w = Math.max(40, startW + (ev.clientX - startX)); model.colW[ci] = w; col.style.width = w + 'px'; };
    const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); document.body.style.userSelect = ''; };
    document.body.style.userSelect = 'none';
    document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
  }

  function renderRows() {
    if (editing) return; // đang sửa ô thì không render lại tránh mất input
    const total = view.length;
    const st = scroll.scrollTop, vh = scroll.clientHeight;
    const first = Math.max(0, Math.floor(st / ROW_H) - BUFFER);
    const last = Math.min(total, Math.ceil((st + vh) / ROW_H) + BUFFER);

    tbody.innerHTML = '';
    if (first > 0) tbody.appendChild(el('tr', { style: `height:${first * ROW_H}px` }));
    for (let vi = first; vi < last; vi++) {
      const ri = view[vi];
      const tr = el('tr', model.dupes && model.dupes.has(ri) ? { class: 'dupe' } : {});
      tr.appendChild(el('td', { class: 'rownum', text: (vi + 1) }));
      for (let ci = 0; ci < nCols; ci++) {
        const key = ri + ':' + ci;
        let cls = 'gcell';
        if (model.errors && model.errors.has(key)) cls += model.errors.get(key) === 'warn' ? ' cell-warn' : ' cell-err';
        else if (model.changed && model.changed.has(key)) cls += ' cell-changed';
        if (inSel(vi, ci)) cls += ' sel';
        if (anchor && anchor.vi === vi && anchor.ci === ci) cls += ' anchor';
        const td = el('td', { class: cls });
        td.dataset.vi = vi; td.dataset.ci = ci;
        const cell = el('div', { class: 'cell', text: model.rows[ri][ci] ?? '' });
        td.appendChild(cell);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    const rest = total - last;
    if (rest > 0) tbody.appendChild(el('tr', { style: `height:${rest * ROW_H}px` }));
  }

  function cellFromEvent(e) {
    const td = e.target.closest('td'); if (!td || td.dataset.vi === undefined) return null;
    return { vi: parseInt(td.dataset.vi), ci: parseInt(td.dataset.ci) };
  }
  function clearSel() { anchor = null; focusCell = null; }

  // chọn vùng bằng chuột
  tbody && null;
  scroll.addEventListener('mousedown', (e) => {
    if (editing) return;
    const c = cellFromEvent(e); if (!c) return;
    if (e.shiftKey && anchor) { focusCell = c; } else { anchor = c; focusCell = c; }
    dragging = true; renderRows();
  });
  scroll.addEventListener('mouseover', (e) => {
    if (!dragging) return;
    const c = cellFromEvent(e); if (!c) return;
    focusCell = c; renderRows();
  });
  document.addEventListener('mouseup', () => { dragging = false; });

  // nhấp đúp để sửa
  scroll.addEventListener('dblclick', (e) => {
    if (!model.editable) return;
    const c = cellFromEvent(e); if (!c) return;
    beginEdit(c, e.target.closest('td'));
  });

  function beginEdit(c, td) {
    editing = c;
    const ri = view[c.vi];
    const cur = model.rows[ri][c.ci] ?? '';
    td.innerHTML = '';
    const inp = el('input', { class: 'cell-edit', value: cur });
    td.appendChild(inp); inp.focus(); inp.select();
    const commit = (move) => {
      if (!editing) return;
      const nv = inp.value;
      if (String(model.rows[ri][c.ci] ?? '') !== nv) { model.rows[ri][c.ci] = nv; if (model.changed) model.changed.add(ri + ':' + c.ci); if (model.onEdit) model.onEdit(ri, c.ci, nv); }
      editing = null; renderRows();
      if (model.onBulkEdit) model.onBulkEdit();
    };
    inp.addEventListener('blur', () => commit());
    inp.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
      else if (ev.key === 'Escape') { editing = null; renderRows(); }
    });
  }

  // copy cả vùng
  scroll.addEventListener('copy', (e) => {
    const s = selRange(); if (!s) return;
    const lines = [];
    for (let vi = s.r1; vi <= s.r2; vi++) {
      const ri = view[vi]; const cells = [];
      for (let ci = s.c1; ci <= s.c2; ci++) {
        let v = String(model.rows[ri][ci] ?? '');
        if (/[\t\n"]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
        cells.push(v);
      }
      lines.push(cells.join('\t'));
    }
    e.clipboardData.setData('text/plain', lines.join('\n'));
    e.preventDefault();
  });

  // dán cả vùng từ ô đang chọn
  scroll.addEventListener('paste', (e) => {
    if (!model.editable) return;
    const s = selRange(); if (!s) return;
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    if (!text) return;
    e.preventDefault();
    const grid = parsePasteText(text);
    let changed = 0;
    for (let dr = 0; dr < grid.length; dr++) {
      const vi = s.r1 + dr; if (vi >= view.length) break;
      const ri = view[vi];
      for (let dc = 0; dc < grid[dr].length; dc++) {
        const ci = s.c1 + dc; if (ci >= nCols) break;
        model.rows[ri][ci] = grid[dr][dc];
        if (model.changed) model.changed.add(ri + ':' + ci);
        changed++;
      }
    }
    // mở rộng vùng chọn ôm trọn dữ liệu vừa dán
    focusCell = { vi: Math.min(view.length - 1, s.r1 + grid.length - 1), ci: Math.min(nCols - 1, s.c1 + (grid[0] ? grid[0].length : 1) - 1) };
    anchor = { vi: s.r1, ci: s.c1 };
    renderRows();
    if (model.onBulkEdit) model.onBulkEdit();
  });

  // Delete xoá nội dung vùng chọn
  scroll.addEventListener('keydown', (e) => {
    if (editing) return;
    if ((e.key === 'Delete' || e.key === 'Backspace') && model.editable) {
      const s = selRange(); if (!s) return;
      e.preventDefault();
      for (let vi = s.r1; vi <= s.r2; vi++) { const ri = view[vi]; for (let ci = s.c1; ci <= s.c2; ci++) { model.rows[ri][ci] = ''; if (model.changed) model.changed.add(ri + ':' + ci); } }
      renderRows(); if (model.onBulkEdit) model.onBulkEdit();
    }
  });

  function parsePasteText(text) {
    text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    const rows = []; let row = [], field = '', inQ = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQ) { if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; } else field += c; }
      else { if (c === '"') inQ = true; else if (c === '\t') { row.push(field); field = ''; } else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; } else field += c; }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    if (rows.length && rows[rows.length - 1].length === 1 && rows[rows.length - 1][0] === '') rows.pop();
    return rows;
  }

  function refresh() { computeView(); mount(); renderRows(); if (model.onViewChange) model.onViewChange(view.length); }

  refresh();
  return {
    refresh,
    getView: () => view.slice(),
    setSize: (big) => { scroll.className = 'grid-scroll ' + (big ? 'big' : 'small'); scroll.setAttribute('tabindex', '0'); renderRows(); },
  };
}


/* ==================== ruleTable.js ==================== */

/*
 * Bảng rule: Cột A | Cột B | thêm/xoá. Bấm "Lưu bảng" mới ghi (onSave).
 * fields: mảng ô "cột đích" phía trên, mỗi ô { label, key }. Rỗng = không có ô cột đích.
 */
function RuleTable({ title, desc, colA, colB, state, onSave, canEdit, fields }) {
  fields = fields || [{ label: 'Cột đích', key: 'targets' }];
  const wrap = el('div', { class: 'panel' });

  const fieldNodes = fields.map(f =>
    el('div', { style: 'display:flex;align-items:center;gap:6px' }, [
      el('span', { class: 'desc', text: f.label + ':' }),
      el('input', {
        class: 'inp', style: 'max-width:130px', placeholder: 'VD: AA',
        value: state[f.key] || '', disabled: !canEdit,
        oninput: e => { state[f.key] = e.target.value; markDirty(); }
      }),
    ]));

  wrap.appendChild(el('div', { class: 'panel-head' }, [
    el('div', {}, [ el('h2', { text: title }), desc ? el('div', { class: 'desc', text: desc }) : null ]),
    el('div', { class: 'spacer', style: 'flex:1' }),
    el('div', { style: 'display:flex;align-items:center;gap:14px;flex-wrap:wrap' }, fieldNodes),
  ]));

  const bodyWrap = el('div', { class: 'panel-body tight' });
  let dirtyBadge;
  if (canEdit) {
    dirtyBadge = el('span', { class: 'desc', style: 'color:var(--warn)' });
    bodyWrap.appendChild(el('div', { class: 'grid-toolbar' }, [
      el('button', { class: 'btn btn-sm', text: '+ Thêm dòng', onclick: () => { state.rows.push({ a: '', b: '' }); render(); markDirty(); } }),
      (() => {
        const lbl = el('label', { class: 'btn btn-sm', text: '⭱ Upload Excel', style: 'position:relative;overflow:hidden' });
        const inp = el('input', { type: 'file', accept: '.xlsx,.xls,.csv', style: 'position:absolute;inset:0;opacity:0;cursor:pointer' });
        inp.addEventListener('change', async e => {
          const f = e.target.files[0]; if (!f) return;
          try {
            const rows = await readExcelToPairs(f);
            if (!rows.length) { toast('File không có dữ liệu hợp lệ', 'warn'); return; }
            state.rows = rows; render(); markDirty();
            toast('Đã nạp ' + rows.length + ' dòng — nhớ bấm Lưu bảng', 'ok');
          } catch { toast('Không đọc được file', 'bad'); }
          e.target.value = '';
        });
        lbl.appendChild(inp);
        return lbl;
      })(),
      el('button', { class: 'btn btn-sm btn-danger', text: 'Xoá tất cả', onclick: () => { state.rows = []; render(); markDirty(); } }),
      el('div', { class: 'spacer', style: 'flex:1' }),
      dirtyBadge,
      el('span', { class: 'desc rowcount' }),
      el('button', {
        class: 'btn btn-sm btn-ok', text: '💾 Lưu bảng',
        onclick: async () => {
          state.rows = (state.rows || []).filter(r => (r.a ?? '') !== '' || (r.b ?? '') !== '');
          await onSave();
          dirty = false; dirtyBadge.textContent = ''; render();
          toast('Đã lưu bảng', 'ok');
        }
      }),
    ]));
  }

  const tblWrap = el('div', { class: 'rt-wrap' });
  bodyWrap.appendChild(tblWrap);
  wrap.appendChild(bodyWrap);

  let dirty = false;
  function markDirty() { if (canEdit) { dirty = true; dirtyBadge.textContent = '● chưa lưu'; } }

  function render() {
    const rows = state.rows || [];
    const table = el('table', { class: 'rt' });
    table.appendChild(el('thead', {}, el('tr', {}, [
      el('th', { text: colA, style: 'width:45%' }),
      el('th', { text: colB, style: 'width:45%' }),
      canEdit ? el('th', { text: '', style: 'width:44px' }) : null,
    ])));
    const tbody = el('tbody');
    rows.forEach((r, i) => {
      tbody.appendChild(el('tr', {}, [
        el('td', {}, el('input', { value: r.a ?? '', disabled: !canEdit, oninput: e => { r.a = e.target.value; markDirty(); } })),
        el('td', {}, el('input', { value: r.b ?? '', disabled: !canEdit, placeholder: colB.includes('rỗng') ? '(để trống = xoá)' : '', oninput: e => { r.b = e.target.value; markDirty(); } })),
        canEdit ? el('td', { class: 'act' }, el('button', { class: 'icon-btn del', text: '✕', title: 'Xoá dòng', onclick: () => { state.rows.splice(i, 1); render(); markDirty(); } })) : null,
      ]));
    });
    if (!rows.length) {
      tbody.appendChild(el('tr', {}, el('td', { colspan: canEdit ? 3 : 2, class: 'muted', style: 'padding:16px;text-align:center', text: 'Chưa có dòng nào. Bấm “+ Thêm dòng” rồi nhập.' })));
    }
    table.appendChild(tbody);
    tblWrap.innerHTML = ''; tblWrap.appendChild(table);
    const rc = wrap.querySelector('.rowcount'); if (rc) rc.textContent = rows.length + ' dòng';
  }

  render();
  return wrap;
}

    t.appendChild(el('thead', {}, el('tr', {}, [
      el('th', { text: 'ID / Tên đăng nhập' }), el('th', { text: 'Tên hiển thị' }),

        const id = box.querySelector('#f-id').value.trim();

        await reload(); c(); toast('Đã lưu', 'ok');

      ]),

        await Store.resetPassword(u.id); c(); toast('Đã đặt lại mật khẩu', 'ok');
      }}]
    });

  function delUser(u) {
    modal({
      title: 'Xoá người dùng', bodyNode: el('p', { text: 'Xoá ' + u.name + ' (' + u.id + ')? Không thể hoàn tác.' }),
      actions: [{ label: 'Huỷ' }, { label: 'Xoá', cls: 'btn-danger', onClick: async (c) => {
        await Store.deleteUser(u.id); await reload(); c(); toast('Đã xoá', 'ok');
      }}]
    });
  }

  async function bulkImport(f) {
    try {
      const rows = await readExcelToPairs(f);
      let added = 0;
      for (const r of rows) {
        const id = r.a; if (!id || users.some(x => x.id.toLowerCase() === id.toLowerCase())) continue;
        await Store.saveUser({ id, name: r.b || id, role: 'editor', canEdit: true, canReport: false, active: true }, '123456');
        added++;
      }
      await reload();
      toast('Đã thêm ' + added + ' người dùng', 'ok');
    } catch { toast('Không đọc được file', 'bad'); }
  }

  render();
}

async function renderInputTab(host, State) {
  host.innerHTML = '';

  const M = {
    headers: [], rows: [],
    changed: new Set(), errors: new Map(), dupes: new Set(),
    editable: canEdit, onEdit: null, onViewChange: null,
  };
  let gridApi = null;
  let failedRows = [];   // {row:[], reasons:[]}
  let keyColIndex = 1;   // cột mã vận đơn mặc định = B (index 1)

  /* ============ BẢNG 1: Dán clipboard ============ */
  const panel1 = el('div', { class: 'panel' });
  panel1.appendChild(el('div', { class: 'panel-head' }, [
    el('h2', { text: 'Bảng 1 — Dán dữ liệu từ Excel' }),

      const data = parseTSVToTable(text);
      pasteBox.value = '';   // xoá cho nhẹ
      if (!data || !data.rows.length) {
        flash1.innerHTML = '<div class="flash bad">Không đọc được dữ liệu. Hãy copy trong Excel trước.</div>';
        return;
      }
      // cảnh báo nếu có ô dạng ký hiệu khoa học (mã vận đơn dài bị Excel rút gọn)
      let sci = 0;
      for (const r of data.rows) for (const v of r) if (/^-?\d(\.\d+)?[Ee][+-]?\d+$/.test(v)) { sci++; }
      loadData(data);
      let msg = '✓ Đã nạp ' + data.rows.length + ' dòng × ' + data.headers.length + ' cột.';
      flash1.innerHTML = '<div class="flash ok">' + msg + '</div>' +
        (sci ? '<div class="flash bad">⚠ Có ' + sci + ' ô dạng 1.23E+11 (số bị Excel rút gọn). Hãy định dạng cột đó về Text trong Excel rồi copy lại.</div>' : '');
    }, 30);
  });

  /* ============ BẢNG 2: Lưới dữ liệu chính ============ */
  const panel2 = el('div', { class: 'panel' });
  const stat2 = el('div', { style: 'display:flex;gap:10px;flex-wrap:wrap;align-items:center' });
  panel2.appendChild(el('div', { class: 'panel-head' }, [
    el('h2', { text: 'Bảng 2 — Dữ liệu chính' }),
    el('div', { class: 'spacer', style: 'flex:1' }),
    stat2,
  ]));

  const toolbar2 = el('div', { class: 'grid-toolbar' }, [
    el('button', { class: 'btn btn-sm btn-primary', id: 'btn-process', text: 'Xử lý dữ liệu', onclick: processData, disabled: !canEdit }),
    el('span', { id: 'process-result', class: 'desc' }),
    el('div', { class: 'spacer', style: 'flex:1' }),
    el('label', { class: 'desc', style: 'display:flex;align-items:center;gap:6px' }, [
      document.createTextNode('Cột mã vận đơn:'),
      (() => {
        const i = el('input', { class: 'inp', style: 'width:70px;padding:4px 8px', value: 'B',
          title: 'Ký hiệu cột Excel chứa mã vận đơn' });
        i.addEventListener('change', () => { const idx = colToIndex(i.value); if (idx >= 0) keyColIndex = idx; });
        return i;
      })(),
    ]),
    el('button', { class: 'btn btn-sm', text: '⤢ To / nhỏ', onclick: () => { big = !big; gridApi && gridApi.setSize(big); } }),
  ]);
  panel2.appendChild(toolbar2);
  panel2.appendChild(el('div', { class: 'desc', style: 'padding:2px 14px 8px;color:var(--ink-soft)',
    text: '💡 Kéo chuột để chọn vùng · Ctrl+C copy · Ctrl+V dán · nhấp đúp để sửa ô · Delete để xoá · Shift+click mở rộng vùng' }));
  const gridHost = el('div');
  panel2.appendChild(gridHost);

  // dòng đếm chưa dịch + nút upload
  const footer2 = el('div', { class: 'grid-toolbar', style: 'border-top:1px solid var(--line-soft);border-bottom:none' }, [
    el('button', { class: 'btn btn-ok', id: 'btn-upload', text: 'UPLOAD MANIFEST', onclick: uploadManifest, disabled: !canEdit }),
    el('div', { class: 'spacer', style: 'flex:1' }),
    el('div', { class: 'stat' }, [
      document.createTextNode('SL đơn hàng chưa dịch: '),
      el('b', { id: 'untranslated', text: '0' }),
    ]),
  ]);
  panel2.appendChild(footer2);
  host.appendChild(panel2);
  let big = true;

  /* ============ BẢNG 4: Dòng lỗi (đặt trước bảng 3 về mặt luồng, hiển thị sau) ============ */
  const panel4 = el('div', { class: 'panel' });
  panel4.appendChild(el('div', { class: 'panel-head' }, [
    el('h2', { text: 'Bảng 4 — Dòng vi phạm' }),
    el('div', { class: 'desc', text: 'Trùng mã vận đơn / tiền tệ VND / tiếng Việt có dấu ở cột Cargo. Bấm ⬆ để duyệt cho qua.' }),
    el('div', { class: 'spacer', style: 'flex:1' }),
    el('button', { class: 'btn btn-sm btn-danger', text: 'Delete ALL', onclick: () => { failedRows = []; renderFailed(); } }),
  ]));
  const failBody = el('div', { class: 'panel-body tight' });
  panel4.appendChild(failBody);
  // panel4 sẽ được gắn SAU panel3 (bên dưới) — xem cuối phần Bảng 3

  /* ============ BẢNG 3: Dịch ============ */
  const panel3 = el('div', { class: 'panel' });
  let trMode = 'en';
  panel3.appendChild(el('div', { class: 'panel-head' }, [
    el('h2', { text: 'Bảng 3 — Dịch tên hàng' }),
    el('div', { class: 'spacer', style: 'flex:1' }),
    (() => {
      const seg = el('div', { class: 'seg' });
      const bEn = el('button', { class: 'on', text: 'EN → VN' });
      const bCn = el('button', { text: 'CN → VN' });
      bEn.onclick = () => { trMode = 'en'; bEn.classList.add('on'); bCn.classList.remove('on'); doTranslate(); };
      bCn.onclick = () => { trMode = 'cn'; bCn.classList.add('on'); bEn.classList.remove('on'); doTranslate(); };
      seg.append(bEn, bCn);
      return seg;
    })(),
    el('button', { class: 'btn btn-sm btn-primary', text: 'Dịch', onclick: doTranslate }),
  ]));
  const trIn = el('textarea', { placeholder: 'Dán tên hàng cần dịch vào đây (mỗi dòng một tên)…' });
  const trOut = el('textarea', { placeholder: 'Kết quả dịch — quét cột này copy sang Bảng 2 theo đúng thứ tự dòng.', readonly: 'readonly' });
  panel3.appendChild(el('div', { class: 'panel-body' }, [
    el('p', { class: 'desc', style: 'margin:0 0 8px', text: 'Cột A: tên gốc — Cột B: bản dịch (dò trong từ điển). Không tìm thấy sẽ giữ nguyên và đánh dấu ⚠.' }),
    el('div', { class: 'tr-cols' }, [trIn, trOut]),
  ]));
  host.appendChild(panel3);
  host.appendChild(panel4);

  /* ================= Hàm xử lý ================= */
  function loadData(data) {
    M.headers = data.headers;
    M.rows = data.rows;
    M.changed = new Set(); M.errors = new Map(); M.dupes = new Set();
    failedRows = [];
    gridApi = DataGrid(gridHost, M);
    gridApi.setSize(big);
    updateStats();
    renderFailed();
    $('#process-result').textContent = '';
    updateUntranslated();
  }

  function clearAll() {
    M.headers = []; M.rows = []; M.changed.clear(); M.errors.clear(); M.dupes.clear();
    failedRows = [];
    gridHost.innerHTML = '<div class="panel-body muted">Chưa có dữ liệu. Dán vào Bảng 1 ở trên.</div>';
    flash1.innerHTML = '';
    updateStats(); renderFailed(); updateUntranslated();
    $('#process-result').textContent = '';
  }

  function updateStats() {
    stat2.innerHTML = '';
    stat2.appendChild(el('span', { class: 'stat', html: 'Dòng: <b>' + M.rows.length + '</b>' }));
    stat2.appendChild(el('span', { class: 'stat', html: 'Cột: <b>' + M.headers.length + '</b>' }));
    if (M.dupes.size) stat2.appendChild(el('span', { class: 'badge bad', text: M.dupes.size + ' trùng' }));
  }

  async function processData() {
    if (!M.rows.length) { toast('Chưa có dữ liệu', 'warn'); return; }
    const rules = await Store.getRules();
    const res = applyRules({ headers: M.headers, rows: M.rows }, rules);
    M.rows = res.grid.rows;
    M.changed = res.changed;

    // Kiểm tra vi phạm -> đẩy xuống bảng 4
    await detectViolations(res.currencyBlocks);

    gridApi = DataGrid(gridHost, M);
    gridApi.setSize(big);
    updateStats();
    updateUntranslated();
    if (res.rulesApplied > 0) {
      $('#process-result').innerHTML = '<span class="badge ok">Đã hoàn thành ' + res.rulesApplied + ' rule</span>';
    } else {
      $('#process-result').innerHTML = '<span class="badge warn">Chưa áp rule nào — vào tab “3. Rule setup” nhập ô “Cột đích” rồi bấm 💾 Lưu bảng</span>';
    }
  }

  async function detectViolations(currencyBlocks) {
    M.errors = new Map();
    M.dupes = new Set();
    const violated = new Map();   // rowIndex -> [reasons]
    const addReason = (ri, reason, ci) => {
      if (!violated.has(ri)) violated.set(ri, []);
      violated.get(ri).push(reason);
      if (ci != null) M.errors.set(ri + ':' + ci, 'err');
    };

    // 1) tiền tệ BLOCK (vd VND)
    for (const b of currencyBlocks) addReason(b.row, 'Tiền tệ ' + b.cur + ' bị chặn', b.col);

    // 2) trùng mã vận đơn với database — tải danh sách khoá MỘT LẦN rồi so cục bộ
    const existing = await Store.getExistingKeys();
    for (let ri = 0; ri < M.rows.length; ri++) {
      const key = String(M.rows[ri][keyColIndex] ?? '').trim();
      if (!key) continue;
      if (existing.has(key)) { addReason(ri, 'Trùng mã vận đơn trong database', keyColIndex); M.dupes.add(ri); }
    }

    // 3) tiếng Việt có dấu ở cột Cargo (mặc định cột AQ = index 42) — có thể chỉnh
    const cargoIdx = colToIndex('AQ');
    if (cargoIdx >= 0 && cargoIdx < M.headers.length) {
      for (let ri = 0; ri < M.rows.length; ri++) {
        if (hasVietnameseDiacritics(M.rows[ri][cargoIdx])) addReason(ri, 'Cột Cargo có tiếng Việt có dấu', cargoIdx);
      }
    }

    // build failedRows và bỏ khỏi bảng chính
    const failIdx = Array.from(violated.keys()).sort((a, b) => b - a);
    failedRows = [];
    for (const ri of failIdx) {
      failedRows.push({ row: M.rows[ri].slice(), reasons: violated.get(ri) });
    }
    // xoá khỏi bảng 2 (từ cuối lên để không lệch chỉ số)
    for (const ri of failIdx) M.rows.splice(ri, 1);
    failedRows.reverse();

    // reset errors map vì chỉ số đã đổi sau khi splice; đánh dấu lại đơn giản: bỏ
    M.errors = new Map();
    renderFailed();
  }

  function renderFailed() {
    failBody.innerHTML = '';
    if (!failedRows.length) {
      failBody.appendChild(el('div', { class: 'panel-body muted', text: 'Không có dòng vi phạm.' }));
      return;
    }
    const t = el('table', { class: 'fail' });
    t.appendChild(el('thead', {}, el('tr', {}, [
      el('th', { text: '', style: 'width:44px' }),
      el('th', { text: 'Lý do vi phạm' }),
      el('th', { text: 'Mã vận đơn' }),
      el('th', { text: 'Xem trước dòng' }),
    ])));
    const tb = el('tbody');
    failedRows.forEach((f, i) => {
      tb.appendChild(el('tr', {}, [
        el('td', { style: 'text-align:center' }, el('button', {
          class: 'icon-btn', title: 'Duyệt cho qua — chuyển lên Bảng 2', text: '⬆',
          onclick: () => approveRow(i)
        })),
        el('td', {}, el('span', { class: 'reason', text: f.reasons.join('; ') })),
        el('td', { text: String(f.row[keyColIndex] ?? '') }),
        el('td', { class: 'muted', text: f.row.slice(0, 6).join(' | ').slice(0, 80) + '…' }),
      ]));
    });
    t.appendChild(tb);
    failBody.appendChild(t);
  }

  function approveRow(i) {
    const f = failedRows[i];
    M.rows.push(f.row);
    failedRows.splice(i, 1);
    gridApi = DataGrid(gridHost, M);
    gridApi.setSize(big);
    updateStats();
    renderFailed();
    updateUntranslated();
    toast('Đã chuyển 1 dòng lên Bảng 2', 'ok');
  }

  async function doTranslate() {
    const dict = await Store.getDict();
    const list = trMode === 'en' ? dict.en : dict.cn;
    const map = new Map(list.map(r => [(r.a || '').toLowerCase().trim(), r.b]));
    const lines = trIn.value.split('\n');
    const out = lines.map(line => {
      const s = line.trim();
      if (!s) return '';
      const hit = map.get(s.toLowerCase());
      return hit != null ? hit : (s + '  ⚠');
    });
    trOut.value = out.join('\n');
  }

  function updateUntranslated() {
    // đếm cột AV (index 47) đang trống nhưng cột mã vận đơn có data
    const avIdx = colToIndex('AV');
    let count = 0;
    if (avIdx >= 0 && avIdx < M.headers.length) {
      for (let ri = 0; ri < M.rows.length; ri++) {
        const hasKey = String(M.rows[ri][keyColIndex] ?? '').trim() !== '';
        const avEmpty = String(M.rows[ri][avIdx] ?? '').trim() === '';
        if (hasKey && avEmpty) count++;
      }
    }
    const node = document.getElementById('untranslated');
    if (node) { node.textContent = count; node.style.color = count === 0 ? 'var(--ok)' : 'var(--bad)'; }
  }
  M.onEdit = () => updateUntranslated();
  M.onBulkEdit = () => updateUntranslated();

  async function uploadManifest() {
    if (!M.rows.length) { toast('Chưa có dữ liệu', 'warn'); return; }
    const box = el('div', {}, [
      el('p', { text: 'Xác nhận đẩy dữ liệu lên database?' }),
      el('table', { class: 'confirm-tbl' }, [
        el('tr', {}, [el('td', { text: 'Số dòng sẽ đẩy' }), el('td', { text: M.rows.length })]),
        el('tr', {}, [el('td', { text: 'Số cột' }), el('td', { text: M.headers.length })]),
        el('tr', {}, [el('td', { text: 'Dòng còn treo ở Bảng 4' }), el('td', { text: failedRows.length })]),
      ]),
      failedRows.length ? el('p', { class: 'muted', text: 'Lưu ý: ' + failedRows.length + ' dòng vi phạm sẽ KHÔNG được đẩy lên.' }) : null,
    ]);
    modal({
      title: 'Xác nhận UPLOAD MANIFEST', bodyNode: box,
      actions: [
        { label: 'RECHECK — quay lại' },
        { label: 'OK — Upload', cls: 'btn-ok', onClick: async (c) => {
          const added = await Store.pushManifest(M.rows, keyColIndex);
          c();
          toast('Đã upload ' + added + ' dòng lên database', 'ok', 3200);
          $('#process-result').innerHTML = '<span class="badge ok">Đã upload ' + added + ' dòng</span>';
        }},
      ]
    });
  }

  // trạng thái ban đầu
  clearAll();
}


/* ==================== app.js ==================== */

const State = { user: null, mode: 'local' };

async function doLogin() {
  const id = $('#login-user').value.trim();
  const pw = $('#login-pass').value;
  const msg = $('#login-msg');
  msg.textContent = '';
  if (!id || !pw) { msg.textContent = 'Nhập đủ tên đăng nhập và mật khẩu.'; return; }

  const btn = $('#login-btn'); btn.disabled = true; btn.textContent = 'Đang đăng nhập…';
  try {
    const res = await Store.login(id, pw);
    if (!res.ok) { msg.textContent = res.msg || 'Đăng nhập thất bại.'; return; }
    State.user = res.user;
    if (res.mustChange) { await forceChangePassword(res.user); }
    enterApp();
  } catch (e) {
    msg.textContent = 'Lỗi kết nối: ' + (e.message || e);
  } finally {
    btn.disabled = false; btn.textContent = 'Đăng nhập';
  }
}

async function forceChangePassword(u) {
  return new Promise(resolve => {
    const box = el('div', {}, [
      el('p', { class: 'muted', text: 'Đây là lần đăng nhập đầu tiên. Vui lòng đặt mật khẩu cá nhân mới.' }),
      el('label', { class: 'fld' }, [el('span', { text: 'Mật khẩu mới' }), el('input', { id: 'np1', type: 'password', class: 'inp' })]),
      el('label', { class: 'fld' }, [el('span', { text: 'Nhập lại mật khẩu' }), el('input', { id: 'np2', type: 'password', class: 'inp' })]),
    ]);
    modal({
      title: 'Đổi mật khẩu bắt buộc', bodyNode: box,
      actions: [{
        label: 'Lưu mật khẩu', cls: 'btn-primary', onClick: async (c) => {
          const p1 = box.querySelector('#np1').value, p2 = box.querySelector('#np2').value;
          if (p1.length < 4) { toast('Mật khẩu tối thiểu 4 ký tự', 'warn'); return; }
          if (p1 !== p2) { toast('Hai mật khẩu không khớp', 'bad'); return; }
          await Store.changePassword(u.id, p1);
          State.user.mustChange = false;
          toast('Đã đổi mật khẩu', 'ok');
          c(); resolve();
        }
      }]
    });
  });
}

function enterApp() {
  $('#login-screen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#who').textContent = State.user.name + ' (' + roleLabel(State.user) + ')';
  applyPermissions();
  buildAllTabs();
  switchTab('input');
}

function roleLabel(u) {
  if (u.role === 'admin') return 'Quản trị';
  if (u.role === 'viewer') return 'Chỉ xem';
  return 'Nhập liệu';
}

function applyPermissions() {
  const adminTabBtn = $$('#tabs .tab').find(b => b.dataset.tab === 'admin');
  if (adminTabBtn) adminTabBtn.style.display = State.user.role === 'admin' ? '' : 'none';
}

function switchTab(name) {
  $$('#tabs .tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  $$('.tabpane').forEach(p => p.classList.remove('active'));
  $('#tab-' + name).classList.add('active');
}

function buildAllTabs() {
  renderInputTab($('#tab-input'), State);
  renderMecTab($('#tab-mec'));
  renderRulesTab($('#tab-rules'), State);
  if (State.user.role === 'admin') renderAdminTab($('#tab-admin'), State);
}

function renderMecTab(host) {
  host.innerHTML = '';
  host.appendChild(el('div', { class: 'panel' }, [
    el('div', { class: 'panel-head' }, el('h2', { text: '2. Kéo MEC' })),
    el('div', { class: 'panel-body' }, [
      el('p', { class: 'muted', text: 'Phần này sẽ được thiết lập sau khi bạn cung cấp rule cho MEC.' }),
      el('p', { class: 'muted', text: 'Cấu trúc đã sẵn sàng để ghép chức năng vào.' }),
    ]),
  ]));
}

function showModeBanner() {
  const box = $('.login-box');
  if (!box) return;
  const b = el('div', { class: 'flash ' + (State.mode === 'api' ? 'ok' : 'warn'),
    style: 'margin-top:14px;font-size:12px' });
  b.textContent = State.mode === 'api'
    ? '● Đang kết nối database chung (Cloudflare).'
    : '● Chế độ thử nghiệm cục bộ — dữ liệu chỉ lưu trên máy này.';
  box.appendChild(b);
}

async function boot() {
  $('#login-btn').addEventListener('click', doLogin);
  $('#login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('#logout-btn').addEventListener('click', async () => { await Store.logout(); location.reload(); });
  $$('#tabs .tab').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

  State.mode = await Store.init();
  showModeBanner();

  // thử phục hồi phiên nếu còn token
  try {
    const r = await Store.resume();
    if (r && r.ok && r.user) {
      State.user = r.user;
      if (r.mustChange) await forceChangePassword(r.user);
      enterApp();
    }
  } catch {}
}
boot();


})();
